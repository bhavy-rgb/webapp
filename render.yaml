# Render Blueprint for Chessify (bhavy-rgb/webapp)
# Put this file in the ROOT of your repo (next to package.json), commit, push.
# Then in Render: New > Blueprint > pick this repo. Both services get created.
#
# IMPORTANT: after the first deploy, check the real URL Render gives the API
# (it may add a suffix if "chessify-api" is taken). If it differs, update the
# /api/* destination below to match, then push again.

services:
  # ---------------------------------------------------------------------------
  # 1) API server — the Express backend (auth, lobby, live games)
  # ---------------------------------------------------------------------------
  - type: web
    name: chessify-api
    runtime: node
    plan: free            # <-- keeps it on the Free instance (no card needed)
    rootDir: server
    # --include=dev is needed because "tsx" (used by `npm start`) is a devDependency
    buildCommand: npm install --include=dev
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true   # Render makes a long random secret for you
      - key: NODE_VERSION
        value: "20.11.1"
      # Optional: point at MongoDB Atlas if you want data to persist.
      # - key: MONGODB_URI
      #   sync: false

  # ---------------------------------------------------------------------------
  # 2) Static site — the built React client
  # ---------------------------------------------------------------------------
  - type: web
    name: chessify-client
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # Send all API calls to the backend service. Keep this ABOVE the catch-all.
      - type: rewrite
        source: /api/*
        destination: https://chessify-api.onrender.com/api/:splat
      # SPA catch-all: lets /lobby, /play/<CODE> etc. load on refresh.
      - type: rewrite
        source: /*
        destination: /index.html
