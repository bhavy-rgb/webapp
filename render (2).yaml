# Render Blueprint — Chessify (bhavy-rgb/webapp)
# Place at the repo ROOT, commit, push, then in Render: New + > Blueprint.

services:
  # 1) API — Express server, MongoDB Atlas persistence
  - type: web
    name: chessify-api
    runtime: node
    plan: free
    rootDir: server
    # --include=dev is required because `tsx` (used by `npm start`) is a devDependency
    buildCommand: npm install --include=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20.11.1"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      # The server uses MONGODB_DB and ignores the DB name inside the URI.
      # Uncomment if your data lives in a differently named database.
      # - key: MONGODB_DB
      #   value: chassisDb
      # - key: ADMIN_USERNAME
      #   value: ARISE

  # 2) Client — static site (React + Vite + prebuilt WASM engine)
  - type: web
    name: chessify-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Vite 7 requires Node 20.19+ (or 22.12+). 20.11.1 broke the build.
      - key: NODE_VERSION
        value: "22.12.0"
    routes:
      # Keep the API rewrite ABOVE the SPA catch-all.
      - type: rewrite
        source: /api/*
        destination: https://chessify-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.wasm
        name: Cache-Control
        value: public, max-age=31536000, immutable
