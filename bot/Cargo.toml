[package]
name = "chessify-bot"
version = "0.2.0"
edition = "2021"
description = "Alpha-beta chess engine for Chessify — native CLI + WebAssembly"

[lib]
name = "chessify_bot"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "chessify-bot"
path = "src/main.rs"

[dependencies]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
